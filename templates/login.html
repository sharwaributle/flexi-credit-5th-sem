<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In · ExpenseMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: #f0f4f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-container {
      background: #ffffff;
      width: 100%;
      max-width: 1040px;
      min-height: 620px;
      border-radius: 32px;
      box-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.08);
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      overflow: hidden;
      border: 1px solid #eef2f6;
    }

    .form-side {
      padding: 56px 64px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #0f172a;
      font-weight: 800;
      font-size: 1.3rem;
      margin-bottom: 36px;
    }

    .brand-badge {
      width: 40px;
      height: 40px;
      background: #2563eb;
      color: #ffffff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      box-shadow: 0 8px 18px -4px rgba(37, 99, 235, 0.4);
    }

    .form-header h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.6px;
      margin-bottom: 8px;
    }

    .form-header p {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    .flash-box {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      margin-bottom: 20px;
    }

    .input-field {
      margin-bottom: 20px;
    }

    .input-field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 8px;
    }

    .input-control {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-control input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      font-size: 0.95rem;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      color: #0f172a;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-control input:focus {
      background: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .pass-icon {
      position: absolute;
      right: 18px;
      color: #94a3b8;
      cursor: pointer;
      font-size: 1rem;
    }

    .btn-submit {
      width: 100%;
      height: 52px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 10px 24px -6px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    .form-foot {
      margin-top: 28px;
      text-align: center;
      font-size: 0.92rem;
      color: #64748b;
    }

    .form-foot a {
      color: #2563eb;
      font-weight: 700;
      text-decoration: none;
    }

    .form-foot a:hover {
      text-decoration: underline;
    }

    .visual-side {
      background: #f8fafc;
      border-left: 1px solid #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px;
      position: relative;
    }

    .banner-graphic {
      width: 100%;
      max-width: 380px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.07));
    }

    .dots-nav {
      display: flex;
      gap: 8px;
      margin-top: 36px;
    }

    .nav-dot {
      width: 8px;
      height: 8px;
      border-radius: 6px;
      background: #cbd5e1;
    }

    .nav-dot.active {
      width: 28px;
      background: #2563eb;
    }

    @media (max-width: 900px) {
      .auth-container {
        grid-template-columns: 1fr;
      }
      .visual-side {
        display: none;
      }
      .form-side {
        padding: 40px 24px;
      }
    }
  </style>
</head>
<body>

  <div class="auth-container">
    
    <div class="form-side">
      <a href="/" class="brand">
        <div class="brand-badge"><i class="fa-solid fa-chart-pie"></i></div>
        <span>ExpenseMate</span>
      </a>

      <div class="form-header">
        <h1>Welcome Back</h1>
        <p>Sign in to manage your budget and track expenses.</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash-box">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('login') }}" method="POST">
        <div class="input-field">
          <label for="identifier">Username or Email</label>
          <div class="input-control">
            <input type="text" id="identifier" name="identifier" placeholder="Enter username or email" required autofocus />
          </div>
        </div>

        <div class="input-field">
          <label for="password">Password</label>
          <div class="input-control">
            <input type="password" id="password" name="password" placeholder="••••••••••••" required />
            <i class="fa-regular fa-eye pass-icon" id="togglePassword"></i>
          </div>
        </div>

        <button type="submit" class="btn-submit">Sign In</button>
      </form>

      <div class="form-foot">
        Don't have an account? <a href="{{ url_for('register') }}">Create Account</a>
      </div>
    </div>

    <div class="visual-side">
      <img 
        class="banner-graphic" 
        src="{{ url_for('static', filename='images/login-banner.jpg') }}" 
        alt="Expense Overview" 
      />
      <div class="dots-nav">
        <div class="nav-dot active"></div>
        <div class="nav-dot"></div>
        <div class="nav-dot"></div>
      </div>
    </div>

  </div>

  <script>
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      togglePassword.classList.toggle('fa-eye');
      togglePassword.classList.toggle('fa-eye-slash');
    });
  </script>
</body>
</html>
